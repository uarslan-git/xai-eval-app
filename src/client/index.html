<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script defer src="index.js"></script>
    <title>Scientific Study</title>
    <style>
      :root {
        --primary-blue: #2563eb;
        --primary-blue-dark: #1e40af;
        --primary-blue-light: #3b82f6;
        --accent-blue: #60a5fa;
        --dark-bg: #0f172a;
        --dark-card: #1e293b;
        --dark-text: #e2e8f0;
        --gray-text: #94a3b8;
      }
      /* Reset default margins */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      /* Full-screen centered layout */
      body {
        font-family: Arial, sans-serif;
        background: linear-gradient(
          135deg,
          var(--dark-bg),
          var(--primary-blue-dark)
        );
        height: 100vh; /* Full viewport height */
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
      }

      /* Title styling */
      h1 {
        font-size: 24px;
        position: absolute;
        top: 20px;
        left: 20px;
        color: var(--dark-text);
      }

      img {
        max-width: 100%;
        height: auto;
        display: block;
      }

      .image-container, .img-container {
        display: inline-block;
        max-width: 100%;
        height: auto;
        overflow: hidden;
      }

      /* Container for form */
      .container {
        color: var(--dark-text);
        width: 300px;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0px 0px 20px rgba(37, 99, 235, 0.3);
        background: var(--dark-card);
        margin-top: -100px;
        border: 1px solid var(--primary-blue);
      }

      /* Input field */
      input {
        width: 100%;
        padding: 10px;
        margin: 10px 0;
        border: 1px solid var(--primary-blue);
        border-radius: 5px;
        font-size: 16px;
        background-color: var(--dark-bg);
        color: var(--dark-text);
      }

      input::placeholder {
        color: var(--gray-text);
      }

      /* Start button */
      button {
        width: 100%;
        background: linear-gradient(
          135deg,
          var(--primary-blue),
          var(--primary-blue-light)
        );
        color: white;
        padding: 10px;
        border: none;
        border-radius: 5px;
        font-size: 18px;
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s;
      }

      /* Button hover effect */
      button:hover {
        background: linear-gradient(
          135deg,
          var(--primary-blue-dark),
          var(--primary-blue)
        );
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
      }
    </style>
  </head>
  <body>
    <h1>XAI Scientific Study</h1>

    <div class="container">
      <h2></h2>
      <input
        type="text"
        id="participant_id"
        placeholder="Enter Participant ID"
      />
      <input type="text" id="study_id" placeholder="Enter Study ID" />
      <button id="start_button">Start</button>
    </div>
  </body>
</html>
